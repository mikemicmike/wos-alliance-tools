@if(!profile()){
<div class="container py-4">
  <div class="card border-0 shadow-sm">
    <div class="card-header bg-body py-3">
      <h1 class="h4 mb-1">New Profile</h1>
    </div>

    <div class="card-body p-4">
      <div *ngIf="errorMessage"
           class="alert alert-danger"
           role="alert">
        {{ errorMessage }}
      </div>

      <form [formGroup]="profileForm"
            (ngSubmit)="submit()"
            novalidate>
        <section class="mb-4">
          <div class="row g-3">
            <div class="col-md-4">
              <label for="name"
                     class="form-label">
                Name
                <span class="text-danger">*</span>
              </label>

              <input id="name"
                     type="text"
                     class="form-control"
                     formControlName="name"
                     [class.is-invalid]="isInvalid('name')" />

              <div class="invalid-feedback">
                Enter a valid Name
              </div>
            </div>

          </div>
        </section>


        <div class="d-flex justify-content-end gap-2">

          <button type="submit"
                  class="btn btn-primary"
                  [disabled]="isSaving()">
            <span *ngIf="isSaving()"
                  class="spinner-border spinner-border-sm me-2"
                  aria-hidden="true"></span>
            {{ isSaving() ? 'Creating...' : 'Create' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
} @else if (profile()?.is_approved === false){
<div class="container">
  <div class="card mt-5">
    <div class="card-body text-center py-5">
      <h2 class="text-danger">User profile rejected!</h2>
    </div>
  </div>
</div>
} @else {
<div class="container">
  <div class="card mt-5">
    <div class="card-body text-center py-5">
      <h2 class="text-success">User profile pending approval!</h2>
    </div>
  </div>
</div>
}
