name: Deploy Angular to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: >
          npx ng build
          --configuration production
          --base-href "/wos-alliance-tools/"
          --output-hashing all

      - name: Show build output
        run: |
          echo "=== DIST ==="
          find dist -maxdepth 4 -type f | sort

          echo ""
          echo "=== INDEX FILES ==="
          find dist -type f -name "index.html" -print

      - name: Find browser build
        id: build-dir
        shell: bash
        run: |
          if [ -f "dist/wos-alliance-tools/browser/index.html" ]; then
            BUILD_DIR="dist/wos-alliance-tools/browser"
          elif [ -f "dist/wos-alliance-tools/index.html" ]; then
            BUILD_DIR="dist/wos-alliance-tools"
          else
            INDEX_FILE=$(find dist -type f -name "index.html" | head -n 1)

            if [ -z "$INDEX_FILE" ]; then
              echo "ERROR: No index.html found in dist"
              exit 1
            fi

            BUILD_DIR=$(dirname "$INDEX_FILE")
          fi

          echo "Deploying from: $BUILD_DIR"
          echo "path=$BUILD_DIR" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== DEPLOYED INDEX.HTML ==="
          cat "$BUILD_DIR/index.html"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.build-dir.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
